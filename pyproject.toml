[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byop"
version = "2.0.0"
description = "Bring Your Own Provider (BYOP): interactive CLI to wire a custom OpenAI-compatible LLM provider into Zed, py.dev, and other AI coding tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "byop" }]
keywords = ["byop", "llm", "ai", "editor", "openai-compatible", "zed", "py.dev", "bring-your-own-provider"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0; sys_platform == 'darwin'",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
byop = "byop.cli:main"

[project.urls]
Homepage = "https://github.com/thinhngotony/byop"

[tool.setuptools.packages.find]
include = ["byop", "byop.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
